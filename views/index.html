<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Validator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card">
    <h1>Email Validator</h1>
    <p class="subtitle">Enter an email address to validate it against the Express API</p>

    <form id="emailForm">
      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input 
          type="text" 
          id="emailInput" 
          name="email" 
          placeholder="Enter email (e.g. user@example.com)..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="btnSubmit">Validate Email</button>
      </div>
    </form>

    <div id="result"></div>
  </div>

  <script src="/js/validate.js"></script>
</body>
</html>
