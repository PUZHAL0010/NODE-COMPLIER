worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Request limits & DDoS mitigation
    limit_req_zone $binary_remote_addr zone=api_global:20m rate=150r/s;
    limit_req_zone $binary_remote_addr zone=job_submission:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # Upstream Stateless API Gateway Replicas (Horizontal Scalability)
    upstream api_gateway_cluster {
        least_conn; # Route to least loaded replica
        server api-gateway-1:3000 max_fails=3 fail_timeout=5s;
        server api-gateway-2:3000 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        listen 3000;
        server_name localhost _;

        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Global connection limit per IP
        limit_conn addr_conn 50;

        # Health & Readiness Probes
        location /healthz {
            proxy_pass http://api_gateway_cluster/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location /readyz {
            proxy_pass http://api_gateway_cluster/readyz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Prometheus Metrics Scraping
        location /metrics {
            proxy_pass http://api_gateway_cluster/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Real-time SSE Execution Stream (Crucial: Disable proxy buffering)
        location ~ ^/api/v1/jobs/[^/]+/stream$ {
            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable all proxy buffering for SSE real-time chunks
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Job Submission API with Burst Rate Limiting
        location /api/v1/jobs {
            limit_req zone=job_submission burst=50 nodelay;
            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # General API Routes
        location /api/ {
            limit_req zone=api_global burst=100 nodelay;
            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Frontend Static Web IDE UI
        location / {
            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
