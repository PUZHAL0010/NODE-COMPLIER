global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'node-compiler-gateways'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'api-gateway-1:3000'
          - 'api-gateway-2:3000'
        labels:
          environment: 'production'
          cluster: 'node-execution-mesh'

  - job_name: 'nginx-load-balancer'
    static_configs:
      - targets: ['nginx-lb:80']
        labels:
          role: 'load-balancer'
